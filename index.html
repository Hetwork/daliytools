  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 13px; line-height: 1.2; color: var(--color-text);\n  background: transparent; border: 1px solid transparent;\n  padding: calc(var(--space-2) * 0.85) var(--space-3);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 34px; height: 34px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n\n\n<style>\n/* Template scaffolding — page layout and web-scale sizing only; every color,\n   font, radius and shadow comes from ../../styles.css. The voice is the\n   deck's, re-derived for a scrolling page: the grid SHOWS — 2px\n   rules draw the structure — red is spent as a mark, and its one field\n   moment is the poster close (the deck's divider logic: the red page sets\n   nothing small).\n\n   THE RHYTHM: a 28px leading unit (17px Archivo body at ~1.65), 14px\n   half-step; line-heights and block margins in unit multiples, heads\n   cap-trimmed, ?baselines/B to review. The deck's seat-pinning relaxes to\n   per-block discipline on a fluid page. The system's own interface\n   components (nav, buttons, inputs) keep their styles.css leading — the\n   rhythm governs the page's text, not the controls.\n\n   THE LANDING LAWS (shared by all six systems' landing templates):\n   #1 display headers break per sentence (.line spans); #2 the landing\n   advertises an invented product played straight — modernist's is Takt,\n   timetables that run like Switzerland; #3 spacing is cluster-scoped\n   (display leading ratio-governed ≈1.06 for Archivo's tight caps — the\n   display-block lattice exemption — tight single-unit gaps inside a text\n   cluster, the air between sections); #4 no hero eyebrow — the nav brand\n   names the product.\n\n   Optical left alignment: the deck's measured Archivo 800 value carries\n   verbatim (-0.058em where caps lead a display line; em-scaled). */\n:root {\n  --leading: 28px;\n  --half: 14px;\n  --edge: clamp(20px, 5vw, 72px);\n  --measure: 58ch;\n}\nhtml { scroll-behavior: smooth; }\n@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }\nbody { margin: 0; text-wrap: pretty; }\n.wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--edge); }\n/* the component demo pads the masthead with its own spacing; on the page the\n   masthead's contents take the page gutter and sit on the wrap's text axis\n   (padding-only — full-width paint such as a masthead rule is untouched) */\n.nav { padding-inline: max(var(--edge), calc((100% - 1200px) / 2 + var(--edge))); }\n.nav a { white-space: nowrap; }\n.nav a[aria-current='location'] { color: var(--color-accent); } /* in-page anchor, not\n   a page link — 'location' is the truthful value; carry the component's active ink */\n@media (max-width: 480px) { .nav a { display: none; } } /* phone width: the nav\n   keeps brand + the one action (layout-only — the component's look is\n   untouched); the full link row's min-content crosses narrow-phone widths */\n\n/* — drawn structure: the 2px rule is the section seam (the deck's header\n   band as page grammar; rules span the content column, solid — this system\n   does not fade its rules) — */\n.rule2 { height: 2px; border: 0; margin: 0; background: var(--color-divider); }\n\n/* — kicker (deck grammar: uppercase, tabular, accent; no hanging dash —\n   modernist marks are squares, and they belong to lists, not labels) — */\n.kicker {\n  display: block; font-size: 13px; line-height: var(--half);\n  letter-spacing: 0.08em; text-transform: uppercase;\n  color: var(--color-accent-700); /* accent-colored SMALL text takes the deep step —\n     6.4:1, where the base accent measures 3.8:1 (a large-text value; the\n     deck's kickers are 24px, this one is 13px) */\n  font-feature-settings: \"tnum\" 1;\n  margin: 0 0 calc(var(--leading) - var(--half));\n}\n\n/* — hero — */\n.hero { padding: calc(4 * var(--leading)) 0 calc(3 * var(--leading)); }\n.display {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: clamp(42px, 6.2vw, 84px);\n  line-height: clamp(44.5px, 6.57vw, 89px); /* law #3: ratio-governed ≈1.06 —\n     Archivo's 800 sits tight and all-cap-height; the display-block lattice\n     exemption (no 14px step is both tighter than the old look and clear) */\n  letter-spacing: -0.02em; margin: 0;\n  margin-left: -0.058em; /* optical left alignment — the deck's measured Archivo 800 value */\n  text-box: trim-both cap alphabetic;\n}\n.display .line { display: block; } /* law #1: one sentence per line */\n.hero .sub { font-size: 17px; line-height: var(--leading); max-width: var(--measure);\n  margin: calc(1.5 * var(--leading) - 1cap) 0 0;\n  text-box: trim-both cap alphabetic; } /* 1.5 units: clears the display's descenders with cluster-tight air (law #3) */\n.hero .row { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--leading); }\n\n/* — stat row (in-grammar: red stays a MARK on the light ground — the stat\n   numerals take the accent at display size, ≥3:1 as large text per the\n   system's own accent rule; the red FIELD is reserved for the close) — */\n.stats { padding: calc(2.5 * var(--leading)) 0; }\n.stats .grid { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: calc(1.5 * var(--leading)) var(--leading); }\n.stat-num { font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: clamp(34px, 3.4vw, 48px); line-height: calc(2 * var(--leading));\n  color: var(--color-accent); /* display figures stay proportional — the deck's figure policy */\n  margin: 0; margin-left: -0.045em; /* digits lead — the deck's \"0\"-population value */\n  text-box: trim-both cap alphabetic; }\n.stat-label { font-size: 13px; line-height: var(--half); letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent); /* small-text ink on the\n     light ground: 70% measures 5.8:1 (the deck's 55% furniture mix is a\n     24px large-text convention — at 13px the 4.5:1 bar applies, and 55%\n     measures only 3.7:1 here) */\n  margin: var(--half) 0 0; }\n\n/* — feature rows (the deck's ruled-toc grammar: 2px rules ON the seams,\n   red square marks hanging at the numbers — drawn structure, no cards) — */\n.features { padding: calc(3 * var(--leading)) 0 calc(2.5 * var(--leading)); }\n.feature { display: grid; grid-template-columns: minmax(64px, 160px) minmax(0, 420px) minmax(0, 1fr);\n  gap: var(--leading) clamp(24px, 4vw, 72px); align-items: baseline;\n  padding: calc(1.5 * var(--leading)) 0; }\n.feature + .feature { border-top: 2px solid var(--color-divider); } /* the ruled seam — solid, the system's weight */\n.f-num { position: relative; font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 15px; line-height: var(--leading); color: var(--color-text);\n  font-feature-settings: \"tnum\" 1; margin: 0; text-box: trim-both cap alphabetic; }\n.f-num::before { content: \"\"; position: absolute; left: -24px; top: calc(0.5cap - 5px);\n  width: 10px; height: 10px; background: var(--color-accent); } /* the deck's 10px red square,\n     hanging left of the number's axis — at narrow widths the gutter folds it away */\n@media (max-width: 1280px) { .f-num::before { display: none; } }\n.f-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 24px; line-height: var(--leading); letter-spacing: -0.01em;\n  margin: 0; text-box: trim-both cap alphabetic; }\n.f-copy { font-size: 15.5px; line-height: var(--leading); margin: 0;\n  color: color-mix(in srgb, var(--color-text) 78%, transparent);\n  max-width: 52ch; text-box: trim-both cap alphabetic; }\n\n/* — imagery split (grayscale photograph — the system prints in black and\n   white; the box pins the bundled asset's 951×665 ratio so swaps\n   cover-crop into the same frame) — */\n.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);\n  gap: var(--leading) clamp(24px, 5vw, 96px); align-items: center;\n  padding: calc(2 * var(--leading)) 0 calc(3 * var(--leading)); }\n.split-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 32px; line-height: calc(1.5 * var(--leading)); letter-spacing: -0.015em;\n  margin: 0; text-box: trim-both cap alphabetic; }\n.split-copy .note { font-size: 15.5px; line-height: var(--leading);\n  color: color-mix(in srgb, var(--color-text) 78%, transparent);\n  margin: calc(var(--leading) - 1cap) 0 0; max-width: 48ch; text-box: trim-both cap alphabetic; }\n.split-figure { margin: 0; }\n.split-figure image-slot { width: 100%; aspect-ratio: 951 / 665; }\n\n/* — quote (hanging punctuation, the deck's measured Archivo advances) — */\n.quote { padding: calc(2.5 * var(--leading)) 0 calc(3.5 * var(--leading)); }\n.quote blockquote {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: clamp(24px, 2.6vw, 34px); line-height: calc(1.5 * var(--leading));\n  letter-spacing: -0.015em; max-width: 32ch; margin: 0;\n  text-indent: -0.496em; /* hang the opening “ (the deck's measured advance in the 800) */\n  text-box: trim-both cap alphabetic;\n}\n.quote figcaption { font-size: 15.5px; line-height: var(--leading);\n  color: color-mix(in srgb, var(--color-text) 70%, transparent); /* 5.8:1 — see .stat-label */\n  margin: calc(var(--leading) - 1cap) 0 0;\n  text-indent: -1.209em; /* hang the leading em-dash + space (measured in the Regular) */\n  text-box: trim-both cap alphabetic; }\n\n@media (max-width: 720px) {\n  /* the phone gutter (--edge bottoms out at 20px) is narrower than the hung\n     marks' measured advances, so a hung “ or em-dash would press into or past\n     the viewport edge — seat the quote flush below this width; the hang\n     returns with the wider gutter */\n  .quote blockquote, .quote figcaption { text-indent: 0; }\n}\n\n/* — the red poster close (the deck's divider logic: the accent's one field\n   moment, type reversed to the paper token). COPY on the red is\n   display-grade only — paper display type measures 3.8:1, the deck\n   dividers' own derivation. The one small element is the ghost button, a\n   CONTROL: paper-on-red measures the same 3.8:1, which meets the system's\n   documented interface-chrome bar (the readme tunes the accent pair to at\n   least 3:1 — \"enough for icons, large text and interface chrome, not for\n   body copy\") — the same bar the system's own accent-filled primary button\n   label rides everywhere. */\n.close { background: var(--color-accent); color: var(--color-bg); }\n.close .wrap { padding-top: calc(3 * var(--leading)); padding-bottom: calc(3 * var(--leading)); }\n.close h3 { font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: clamp(34px, 4.2vw, 56px); line-height: clamp(36px, 4.45vw, 59.4px); /* ≈1.06 —\n     display-grade, so it carries the display-block lattice exemption (the\n     rhythm probe excludes .display and .close h3 alike) */\n  letter-spacing: -0.015em; margin: 0; margin-left: -0.058em;\n  text-box: trim-both cap alphabetic; }\n.close h3 .line { display: block; }\n.close .row { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: calc(1.5 * var(--leading)); }\n.close .btn-ghost { color: var(--color-bg); border-color: var(--color-bg); } /* paper outline on the red field */\nfooter { padding: calc(2 * var(--leading)) 0; font-size: 13px; line-height: var(--leading);\n  color: color-mix(in srgb, var(--color-text) 70%, transparent); /* 5.8:1 — see .stat-label */ }\n\n/* — responsive collapse — */\n/* the feature grid's fixed-max columns (160 + 420 + gaps) crush the copy\n   column in the tablet band, so it collapses earlier than the page */\n@media (max-width: 880px) {\n  .feature { grid-template-columns: 1fr; gap: var(--half); }\n  .f-copy { max-width: var(--measure); }\n}\n@media (max-width: 720px) {\n  .hero { padding-top: calc(2.5 * var(--leading)); }\n  .stats .grid { grid-template-columns: repeat(2, 1fr); justify-content: start; }\n  .split { grid-template-columns: 1fr; }\n  .split-figure { order: -1; }\n}\n\n/* Review aid: the 28px rhythm drawn as hairlines — debug chrome, toggled by\n   ?baselines or the B key, never part of the look. */\nbody[data-baselines] { position: relative; }\nbody[data-baselines]::after {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background:\n    repeating-linear-gradient(to bottom,\n      color-mix(in srgb, var(--color-accent) 35%, transparent) 0 1px,\n      transparent 1px var(--leading)),\n    repeating-linear-gradient(to bottom,\n      transparent 0 var(--half),\n      color-mix(in srgb, var(--color-accent) 16%, transparent) var(--half) calc(var(--half) + 1px),\n      transparent calc(var(--half) + 1px) var(--leading));\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<nav class=\"nav\">\n  <span class=\"nav-brand\">daily.tools<\u002Fspan>\n  <a href=\"#product\" aria-current=\"location\">Tools<\u002Fa>\n  <a href=\"#network\">Principles<\u002Fa>\n  <a href=\"#start\">Start<\u002Fa>\n  <button type=\"button\" class=\"btn btn-primary\">Open the tools<\u002Fbutton>\n<\u002Fnav>\n<div class=\"wrap\">\n\n  <section class=\"hero\">\n    <h1 class=\"display\"><span class=\"line\">The tools you use daily.<\u002Fspan> <span class=\"line\">In one place.<\u002Fspan><\u002Fh1>\n    <p class=\"sub\">daily.tools is a single page of fast, free utilities for everyday work — converters, calculators, timers, text and file tools. No sign-up, no ads, no clutter. Open it, do the thing, get back to work.<\u002Fp>\n    <div class=\"row\">\n      <button type=\"button\" class=\"btn btn-primary\">Open the tools<\u002Fbutton>\n      <button type=\"button\" class=\"btn btn-ghost\">See the full list<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"rule2\">\n\n  <section class=\"stats\" aria-label=\"daily.tools, by the numbers\">\n    <div class=\"grid\">\n      <div><p class=\"stat-num\">50+<\u002Fp><p class=\"stat-label\">Tools, one page each<\u002Fp><\u002Fdiv>\n      <div><p class=\"stat-num\">0<\u002Fp><p class=\"stat-label\">Sign-ups, ads, or trackers<\u002Fp><\u002Fdiv>\n      <div><p class=\"stat-num\">&lt;1s<\u002Fp><p class=\"stat-label\">From click to working tool<\u002Fp><\u002Fdiv>\n      <div><p class=\"stat-num\">100%<\u002Fp><p class=\"stat-label\">Free, today and every day<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"rule2\">\n\n  <section class=\"features\" id=\"product\">\n    <span class=\"kicker\">What you get<\u002Fspan>\n    <div class=\"feature\">\n      <p class=\"f-num\">01<\u002Fp>\n      <h2 class=\"f-title\">Convert anything<\u002Fh2>\n      <p class=\"f-copy\">Units, currencies, time zones, file formats, colors. Type a value, read the answer — every converter follows the same layout, so the tenth tool feels as familiar as the first.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"feature\">\n      <p class=\"f-num\">02<\u002Fp>\n      <h2 class=\"f-title\">Count, time, calculate<\u002Fh2>\n      <p class=\"f-copy\">Word counters, percentage and date calculators, timers and stopwatches. The everyday arithmetic you do ten times a week, done in one keystroke instead of a spreadsheet.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"feature\">\n      <p class=\"f-num\">03<\u002Fp>\n      <h2 class=\"f-title\">Clean up text and files<\u002Fh2>\n      <p class=\"f-copy\">Case changers, JSON formatters, image compressors, PDF splitters. Everything runs in your browser — your files never leave your machine, and there is nothing to install.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"split\" id=\"network\">\n    <div class=\"split-copy\">\n      <span class=\"kicker\">Principles<\u002Fspan>\n      <h2 class=\"split-title\">Plain on purpose<\u002Fh2>\n      <p class=\"note\">A daily tool earns its place by disappearing. No onboarding, no upsell, no newsletter modal — ink on near-white, one input, one result. Red is spent on exactly one thing: the button that does the work.<\u002Fp>\n    <\u002Fdiv>\n    <figure class=\"split-figure grayscale\">\n      <image-slot id=\"photo-split\" shape=\"rect\" role=\"img\" aria-label=\"Product photograph printed in black and white\"><\u002Fimage-slot>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <section class=\"quote\">\n    <figure>\n      <!-- keep the leading “ — the blockquote's negative text-indent hangs it in the margin -->\n      <blockquote>“I closed forty bookmarks and kept one. Whatever the task is, daily.tools already has the tool for it.”<\u002Fblockquote>\n      <!-- keep the leading \"— \" — the figcaption's negative text-indent hangs it -->\n      <figcaption>— M. Alvarez, operations lead<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<section class=\"close\" id=\"start\">\n  <div class=\"wrap\">\n    <h3><span class=\"line\">Use it once.<\u002Fspan> <span class=\"line\">You’ll use it daily.<\u002Fspan><\u002Fh3>\n    <div class=\"row\">\n      <button type=\"button\" class=\"btn btn-ghost\">Open the tools — free, no sign-up<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"wrap\">\n  <footer>daily.tools — free utilities for everyday work. Runs in your browser; nothing leaves your machine.<\u002Ffooter>\n<\u002Fdiv>\n<script src=\"dfe9ba70-9ea4-4ae9-a618-421cfa94f8ed\"><\u002Fscript>\n<script>document.getElementById('photo-split').setAttribute('src', (window.__resources && window.__resources.photoSplit) || 'assets/photo.jpg');<\u002Fscript>\n<script>\n// Review aid: baseline-grid overlay — add ?baselines to the URL, or press B to toggle.\n(() => {\n  if (new URLSearchParams(location.search).has('baselines')) document.body.setAttribute('data-baselines', '');\n  addEventListener('keydown', (e) => {\n    const t = e.target;\n    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;\n    if ((e.key === 'b' || e.key === 'B') && !e.metaKey && !e.ctrlKey && !e.altKey) document.body.toggleAttribute('data-baselines');\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
