<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191716" />
      <stop offset="100%" stop-color="#242120" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec3013" />
      <stop offset="100%" stop-color="#ff5733" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(243, 242, 242, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="627" fill="none" stroke="rgba(243, 242, 242, 0.12)" stroke-width="2" />
  <rect x="32" y="32" width="1136" height="611" fill="none" stroke="rgba(243, 242, 242, 0.06)" stroke-width="1" />

  <!-- Top Bar / Brand Tag -->
  <g transform="translate(64, 72)">
    <rect x="0" y="0" width="130" height="34" fill="#ec3013" rx="2" />
    <text x="65" y="22" fill="#f3f2f2" font-family="'Archivo', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">
      PRODUCTIVITY
    </text>

    <text x="150" y="23" fill="#f3f2f2" font-family="'Archivo', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" opacity="0.6">
      DALIY<tspan fill="#ec3013">.</tspan>TOOLS EDITORIAL
    </text>
  </g>

  <!-- Title & Subtitle Left Side -->
  <g transform="translate(64, 180)">
    <!-- Big Number 10 -->
    <text x="0" y="60" fill="#ec3013" font-family="'Archivo', -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="-2">
      10 FREE
    </text>
    <text x="0" y="136" fill="#f3f2f2" font-family="'Archivo', -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      ONLINE TOOLS
    </text>
    <text x="0" y="206" fill="#f3f2f2" font-family="'Archivo', -apple-system, sans-serif" font-size="52" font-weight="700" letter-spacing="-1" opacity="0.9">
      THAT SAVE YOU AN
    </text>
    <text x="0" y="278" fill="url(#accentGrad)" font-family="'Archivo', -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">
      HOUR A DAY
    </text>

    <text x="0" y="340" fill="#f3f2f2" font-family="'Archivo', -apple-system, sans-serif" font-size="18" font-weight="400" opacity="0.65">
      Stop wasting 60 minutes on repetitive digital chores.
    </text>
  </g>

  <!-- Right Side Visual Illustration Graphic -->
  <g transform="translate(740, 120)">
    <!-- Ambient Glow Circle -->
    <circle cx="210" cy="210" r="180" fill="#ec3013" opacity="0.08" />

    <!-- Clock / Time Saved Meter -->
    <circle cx="210" cy="210" r="150" fill="#1b1817" stroke="#33302f" stroke-width="4" />
    <circle cx="210" cy="210" r="150" fill="none" stroke="#ec3013" stroke-width="8" stroke-dasharray="942" stroke-dashoffset="706" stroke-linecap="round" transform="rotate(-90 210 210)" />

    <!-- Clock Center Hub -->
    <circle cx="210" cy="210" r="8" fill="#ec3013" />
    <line x1="210" y1="210" x2="210" y2="105" stroke="#f3f2f2" stroke-width="5" stroke-linecap="round" />
    <line x1="210" y1="210" x2="285" y2="210" stroke="#ec3013" stroke-width="4" stroke-linecap="round" />

    <!-- Time Badge Inside Clock -->
    <rect x="150" y="240" width="120" height="36" fill="#201e1d" stroke="rgba(243,242,242,0.15)" stroke-width="1.5" rx="4" />
    <text x="210" y="264" fill="#f3f2f2" font-family="'Archivo', -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="1" text-anchor="middle">
      +60 MIN/DAY
    </text>

    <!-- Floating Tool Badges -->
    <g transform="translate(-40, 40)">
      <rect width="130" height="46" fill="#201e1d" stroke="#ec3013" stroke-width="2" rx="4" />
      <text x="65" y="28" fill="#f3f2f2" font-family="'Archivo', -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        PDF Compress
      </text>
    </g>

    <g transform="translate(320, 90)">
      <rect width="115" height="46" fill="#201e1d" stroke="rgba(243,242,242,0.2)" stroke-width="1.5" rx="4" />
      <text x="57" y="28" fill="#f3f2f2" font-family="'Archivo', -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        Smart Notes
      </text>
    </g>

    <g transform="translate(-60, 310)">
      <rect width="140" height="46" fill="#201e1d" stroke="rgba(243,242,242,0.2)" stroke-width="1.5" rx="4" />
      <text x="70" y="28" fill="#f3f2f2" font-family="'Archivo', -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        Auto-Schedule
      </text>
    </g>

    <g transform="translate(290, 330)">
      <rect width="145" height="46" fill="#201e1d" stroke="#ec3013" stroke-width="2" rx="4" />
      <text x="72" y="28" fill="#f3f2f2" font-family="'Archivo', -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        File Converter
      </text>
    </g>
  </g>

  <!-- Bottom Accent Stripe & Date -->
  <rect x="64" y="580" width="1072" height="2" fill="rgba(243, 242, 242, 0.12)" />
  <g transform="translate(64, 612)">
    <text x="0" y="0" fill="#f3f2f2" font-family="'Archivo', -apple-system, sans-serif" font-size="14" font-weight="500" opacity="0.5">
      7 MIN READ &bull; 10 ACTIONABLE WORKFLOWS &bull; SEPTEMBER 16, 2026
    </text>
    <text x="1072" y="0" fill="#ec3013" font-family="'Archivo', -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="end">
      daliy.tools/blogs
    </text>
  </g>
</svg>
